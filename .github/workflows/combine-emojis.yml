name: Combine Emojis and Create PR

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight (UTC)

# Never run two updates at once
concurrency:
  group: combine-emojis
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  combine_emojis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: src/update_emojis/requirements.txt

      - name: Install dependencies
        run: pip install -r src/update_emojis/requirements.txt

      # Shallow + sparse clones into the runner temp dir (outside the workspace),
      # so only the asset folders are downloaded and nothing can end up in the PR.
      - name: Clone source repositories
        run: |
          clone() { # <repo> <folder> <dir>
            git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/$1.git" "$3"
            git -C "$3" sparse-checkout set "$2"
          }
          clone microsoft/fluentui-emoji assets "$RUNNER_TEMP/regular" & p1=$!
          clone Tarikul-Islam-Anik/Animated-Fluent-Emojis Emojis "$RUNNER_TEMP/animated" & p2=$!
          wait $p1 && wait $p2

      - name: Combine emojis
        run: python src/update_emojis/main.py
        env:
          dir_regular: ${{ runner.temp }}/regular/assets
          dir_animated: ${{ runner.temp }}/animated/Emojis
          dir_output: ./Emojis

      # The action commits the changes itself and does nothing if there are none
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: combined-emojis-update
          commit-message: Combined emojis with latest data
          title: 'Combined emojis update'
          body: 'This pull request was created automatically by the GitHub Actions workflow.'
          labels: update, auto-generated
          reviewers: malte9799
          delete-branch: true
